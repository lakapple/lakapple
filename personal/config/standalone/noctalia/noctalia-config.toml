[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.79999998211860657
capsule = true
capsule_opacity = 0.0
center = [ "control-center", "clock", "media", "audio_visualizer" ]
end = [ "tray", "widget", "network", "bluetooth", "volume", "brightness", "battery", "notifications", "session" ]
margin_edge = 8
margin_ends = 8
padding = 8
radius = 16
start = [ "launcher", "workspaces" ]
widget_spacing = 0

    [bar.default.dead_zone.actions]
    scroll_down = "exec niri msg action focus-column-right"
    scroll_up = "exec niri msg action focus-column-left"

[battery]
warning_threshold = 20

[calendar]

[control_center]
sidebar = "full"
sidebar_section = "none"

    [control_center.calendar]
    show_week_numbers = true

[location]
auto_locate = true

[lockscreen]
