[notification]
border = false

[osd]
background_opacity = 0.79999998211860657
offset_y = 16
position = "bottom_center"

[plugin_settings."alexander/screen-toolkit"]
panel_open_near_click = true
panel_placement = "attached"
selected-ocr-lang = "eng+vie"

[plugins]
enabled = [ "noctalia/notes", "alexander/screen-toolkit" ]

[shell]
avatar_path = "/home/lakapple/Projects/lakapple/personal/assets/icons/creeper_face_512x512.png"
button_borders = false
card_borders = false
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    compact = true
    pinned = [ "zen", "dev.zed.Zed", "com.shellyorg.shelly" ]

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.session]
        global = true

        [shell.launcher.providers.wallpaper]
        global = true

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    open_near_click_control_center = true
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 42

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    label = "Sleep"
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Noctalia"
community_palette = "Noctalia legacy"
custom_palette = "noctalia-catppuccin-mocha-lavender"
mode = "dark"
source = "custom"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "ghostty", "kcolorscheme", "niri", "qt" ]
    community_ids = [ "fcitx5" ]

[wallpaper]
directory = "/home/lakapple/Projects/lakapple/personal/assets/wallpapers"
transition = [ "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/lakapple/Projects/lakapple/personal/assets/wallpapers/catppuccin_dots_wave_1920x1080.png"

    [wallpaper.last]
    path = "/home/lakapple/Projects/lakapple/personal/assets/wallpapers/catppuccin_dots_wave_1920x1080.png"

    [wallpaper.monitors.eDP-1]
